<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<title>חשבון אילת</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חשבון אילת">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ef; --card:#fff; --ink:#1d2a30; --muted:#6b7a80; --line:#ece3d6;
  --sea:#0e7c86; --sea-soft:#e1f1f2; --coral:#e8603f; --coral-soft:#fde9e3; --green:#1f8a4c; --green-soft:#e3f4ea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;font-size:16px}
header{background:linear-gradient(135deg,#0e7c86,#11a3a0 60%,#f29a5e);color:#fff;padding:18px 16px 14px;padding-top:max(18px,env(safe-area-inset-top))}
header h1{margin:0;font-size:22px}
header .sub{opacity:.9;font-size:14px;margin-top:4px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#bdf5c9;display:inline-block}
.dot.off{background:#ffd37a}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;border:0;background:none;padding:13px 4px;font:inherit;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
nav button.on{color:var(--sea);border-color:var(--sea);font-weight:500}
main{max-width:640px;margin:0 auto;padding:14px 16px 110px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.exp{cursor:pointer}
.exp .top{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.exp .meta{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.45}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
h2{font-size:17px;margin:18px 2px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pos{color:var(--green);font-weight:500}.neg{color:var(--coral);font-weight:500}.zero{color:var(--muted)}
.xfer{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.xfer:last-child{border-bottom:0}
.xfer .amt{margin-inline-start:auto;font-weight:700;background:var(--coral-soft);color:var(--coral);padding:4px 10px;border-radius:99px}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:500;cursor:pointer}
.btn.primary{background:var(--sea);color:#fff}
.btn.ghost{background:var(--sea-soft);color:var(--sea)}
.btn.danger{background:var(--coral-soft);color:var(--coral)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.fab{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;border:0;border-radius:99px;padding:15px 26px;font:inherit;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(232,96,63,.4);z-index:10}
input,select{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--sea);border-color:transparent}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 5px}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 20px));max-height:calc(100% - 30px);color:var(--ink)}
dialog::backdrop{background:rgba(20,30,35,.45)}
.dlg{padding:16px}
.dlg h3{margin:0 0 4px;font-size:19px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-top:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:inherit;font-size:15px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--sea);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-size:15px}
.chip.on{background:var(--sea);border-color:var(--sea);color:#fff}
.custom-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.custom-row span{flex:1}
.custom-row input{width:120px}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.hint.err{color:var(--coral)}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .grow{flex:1}
.linkbtn{background:none;border:0;color:var(--sea);font:inherit;font-size:14px;padding:4px;text-decoration:underline}
.addp{display:flex;gap:8px}
.addp input{flex:1}
details{margin-top:6px}summary{cursor:pointer;color:var(--sea);font-size:14px}
.banner{background:#fff4d6;color:#7a5a00;font-size:13px;padding:8px 16px;text-align:center}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.total{font-size:14px;color:var(--muted);margin:2px 2px 10px}
</style>
</head>
<body>
<header>
  <h1>🌴 חשבון אילת</h1>
  <div class="sub"><span class="dot" id="dot"></span><span id="sub">טוען…</span></div>
</header>
<div class="banner" id="localBanner" hidden>מצב בדיקה מקומי – הנתונים נשמרים רק במכשיר הזה</div>
<nav>
  <button data-tab="expenses" class="on">הוצאות</button>
  <button data-tab="balances">מי חייב למי</button>
  <button data-tab="people">חברים</button>
  <button data-tab="history">היסטוריה</button>
</nav>
<main>
  <section id="expenses" class="on"></section>
  <section id="balances"></section>
  <section id="people"></section>
  <section id="history"></section>
</main>
<button class="fab" id="fab">+ הוצאה חדשה</button>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
